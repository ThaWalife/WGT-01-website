{% extends "base.html" %}
{% from "_art.html" import docframe %}
{% block main %}
<section class="tone page-hero" data-c="black">
  {{ docframe('cookie.psd', [50]) }}
  <div class="wrap">
    <p class="lbl lbl--muted" style="margin-bottom:14px">[cookie e privacy]</p>
    <h1>Cookie e privacy</h1>
    <p>Cosa salva questo sito, cosa no, e come cambiare la tua scelta.</p>
  </div>
</section>
<div class="band" data-from="#000000" data-to="#ffffff"></div>
<section class="tone section" data-c="white" style="padding-top:56px">
  <div class="wrap cookie-page">
    <article class="doc-body">{{ body|safe }}</article>
    <aside class="win cookie-prefs" aria-labelledby="pref-t">
      <div class="win__bar"><span id="pref-t">Preferenze cookie</span></div>
      <div class="cookie-prefs__body">
        <label class="cookie-row cookie-row--locked"><input type="checkbox" checked disabled> <span><b>Tecnici</b><br><small>Sempre attivi: ricordano solo la tua scelta.</small></span></label>
        <label class="cookie-row"><input type="checkbox" data-consent-toggle="terzi"> <span><b>Servizi di terze parti</b><br><small>Pagamento Payhip nella pagina, quando sarà attivo.</small></span></label>
        <p class="small" data-consent-state aria-live="polite">Non hai ancora scelto.</p>
        <div class="actions">
          <button class="btn" type="button" data-consent="salva">Salva le preferenze</button>
          <button class="btn" type="button" data-consent="rifiuta">Rifiuta tutto</button>
          <button class="btn" type="button" data-consent="accetta">Accetta tutto</button>
        </div>
      </div>
    </aside>
  </div>
</section>
<div class="band" data-from="#ffffff" data-to="#000000"></div>
{% endblock %}
