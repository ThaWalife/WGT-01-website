{# Sagome di sfondo: strumenti di Photoshop e segni di stampa, riempiti con le trame
   degli algoritmi (punti = halftone, tratteggio = incisione, scacchiera = dither).
   Si usano con la macro art() di _art.html. Disegni originali, non le icone di Adobe. #}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    {% for t, c in [('g', '#0a8a4f'), ('k', '#272727'), ('w', '#e4e4e4')] %}
    <pattern id="pd-{{ t }}" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="2.3" fill="{{ c }}"/></pattern>
    <pattern id="ph-{{ t }}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="2.6" fill="{{ c }}"/></pattern>
    <pattern id="pq-{{ t }}" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="{{ c }}"/><rect x="2" y="2" width="2" height="2" fill="{{ c }}"/></pattern>
    {% endfor %}

    <symbol id="ic-brush" viewBox="0 0 100 100"><g transform="rotate(40 50 50)"><rect x="43" y="-4" width="14" height="50" rx="7"/><rect x="40" y="44" width="20" height="12"/><path d="M40 56 Q40 82 50 100 Q60 82 60 56 Z"/></g></symbol>
    <symbol id="ic-pen" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M50 2 L80 40 Q73 70 61 98 L39 98 Q27 70 20 40 Z M50 50 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 Z M48.5 2 L51.5 2 L51.5 43 L48.5 43 Z"/></symbol>
    <symbol id="ic-lasso" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M50 6 C78 6 96 20 96 38 C96 56 78 70 50 70 C22 70 4 56 4 38 C4 20 22 6 50 6 Z M50 16 C28 16 14 26 14 38 C14 50 28 60 50 60 C72 60 86 50 86 38 C86 26 72 16 50 16 Z"/><path d="M26 64 Q14 80 30 96 L37 90 Q26 80 35 67 Z"/></symbol>
    <symbol id="ic-wand" viewBox="0 0 100 100"><path d="M40 52 L48 44 L98 94 L90 100 Z"/><path d="M28 6 L33 21 L49 21 L36 31 L41 46 L28 37 L15 46 L20 31 L7 21 L23 21 Z"/></symbol>
    <symbol id="ic-dropper" viewBox="0 0 100 100"><g transform="rotate(45 50 50)"><rect x="39" y="0" width="22" height="24" rx="9"/><rect x="34" y="23" width="32" height="9"/><path d="M43 32 L57 32 L55 84 L50 100 L45 84 Z"/></g></symbol>
    <symbol id="ic-bucket" viewBox="0 0 100 100"><g transform="rotate(-18 46 58)"><path d="M16 36 L72 36 L64 92 L24 92 Z"/><path fill-rule="evenodd" d="M44 10 C62 10 72 22 72 36 L64 36 C64 26 56 18 44 18 C32 18 24 26 24 36 L16 36 C16 22 26 10 44 10 Z"/></g><path d="M88 56 Q99 76 88 86 Q77 76 88 56 Z"/></symbol>
    <symbol id="ic-move" viewBox="0 0 100 100"><path d="M50 2 L64 18 L55 18 L55 45 L82 45 L82 36 L98 50 L82 64 L82 55 L55 55 L55 82 L64 82 L50 98 L36 82 L45 82 L45 55 L18 55 L18 64 L2 50 L18 36 L18 45 L45 45 L45 18 L36 18 Z"/></symbol>
    <symbol id="ic-crop" viewBox="0 0 100 100"><path d="M22 0 L31 0 L31 69 L100 69 L100 78 L22 78 Z"/><path d="M0 22 L78 22 L78 100 L69 100 L69 31 L0 31 Z"/></symbol>
    <symbol id="ic-cursor" viewBox="0 0 100 100"><path d="M22 2 L22 82 L40 66 L52 96 L66 90 L54 61 L78 61 Z"/></symbol>
    <symbol id="ic-zoom" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M40 6 A34 34 0 1 1 39.99 6 Z M40 18 A22 22 0 1 0 40.01 18 Z"/><path d="M62 70 L70 62 L98 90 L90 98 Z"/></symbol>
    <symbol id="ic-type" viewBox="0 0 100 100"><path d="M8 6 L92 6 L92 30 L83 30 L79 17 L57 17 L57 84 L69 88 L69 95 L31 95 L31 88 L43 84 L43 17 L21 17 L17 30 L8 30 Z"/></symbol>
    <symbol id="ic-layers" viewBox="0 0 100 100"><path d="M50 6 L96 30 L50 54 L4 30 Z"/><path d="M4 48 L13 43 L50 62 L87 43 L96 48 L50 72 Z"/><path d="M4 66 L13 61 L50 80 L87 61 L96 66 L50 90 Z"/></symbol>
    <symbol id="ic-reg" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M50 14 A36 36 0 1 1 49.99 14 Z M50 20 A30 30 0 1 0 50.01 20 Z"/><circle cx="50" cy="50" r="13"/><rect x="48" y="0" width="4" height="100"/><rect x="0" y="48" width="100" height="4"/></symbol>
    <symbol id="ic-bezier" viewBox="0 0 100 100"><path fill="none" stroke-width="5" d="M8 82 C26 12 74 12 92 82"/><path fill="none" stroke-width="2.5" d="M8 82 L28 18 M92 82 L72 18"/><rect x="2" y="76" width="12" height="12"/><rect x="86" y="76" width="12" height="12"/><circle cx="28" cy="18" r="6"/><circle cx="72" cy="18" r="6"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M2 50 Q50 2 98 50 Q50 98 2 50 Z M50 30 A20 20 0 1 0 50.01 30 Z M50 41 A9 9 0 1 1 49.99 41 Z"/></symbol>
    <symbol id="ic-ruler" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M2 34 L98 34 L98 66 L2 66 Z M10 34 L12 34 L12 48 L10 48 Z M22 34 L24 34 L24 42 L22 42 Z M34 34 L36 34 L36 48 L34 48 Z M46 34 L48 34 L48 42 L46 42 Z M58 34 L60 34 L60 48 L58 48 Z M70 34 L72 34 L72 42 L70 42 Z M82 34 L84 34 L84 48 L82 48 Z"/></symbol>
    <symbol id="ic-swatch" viewBox="0 0 100 100"><circle cx="36" cy="36" r="26"/><circle cx="64" cy="36" r="26"/><circle cx="50" cy="62" r="26"/></symbol>
  </defs>
</svg>
